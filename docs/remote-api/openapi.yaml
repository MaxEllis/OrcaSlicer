openapi: 3.0.3
info:
  title: OrcaSlicer Remote API
  version: "1.0"
  description: |
    Token-authenticated HTTP + WebSocket API embedded in OrcaSlicer, exposing the
    running application for automation (status, live config read/write, slicing,
    and an event stream).

    **Enabling:** Preferences → *Remote API*: enable, choose LAN vs localhost,
    port (default 13130), and copy/regenerate the token. Off by default.

    **Auth:** every HTTP request must send `X-Api-Token: <token>`. The WebSocket
    endpoint authenticates via a `?token=<token>` query parameter (browser WS
    clients cannot set request headers).

    **Threading note:** the server runs a single I/O thread and dispatches most
    endpoints onto the GUI thread with a 10s timeout (`504 ui_timeout`). Treat the
    API as single-client; concurrent heavy calls serialize.
servers:
  - url: http://{host}:{port}/api/v1
    variables:
      host: { default: "127.0.0.1", description: "localhost, or the machine's LAN IP when 'Bind LAN' is on" }
      port: { default: "13130" }
security:
  - ApiToken: []
paths:
  /status:
    get:
      summary: Application + project status
      operationId: getStatus
      responses:
        "200":
          description: Current app, project, loaded objects, selected/modified presets, and slice validity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /config:
    get:
      summary: Read the merged (full) config
      operationId: getConfig
      description: |
        Returns the secure merged config (secrets redacted) as canonical string
        values (same form as `.ini`/`.3mf`). Optionally filter with `?keys=`.
      parameters:
        - name: keys
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated key list, e.g. `layer_height,wall_loops`.
          example: layer_height,wall_loops
      responses:
        "200":
          description: Config map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    type: object
                    additionalProperties: { type: string }
                    example: { layer_height: "0.2", wall_loops: "2" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Apply config changes (live)
      operationId: putConfig
      description: |
        Applies key/value edits through the GUI's own edit path (dirty markers +
        live panel refresh + slice invalidation), exactly as if typed in the UI.

        **Atomic:** if ANY key is unknown or fails validation, NOTHING is applied
        and the response is `422` with per-key reasons. On full success the
        response is `200` with every applied key.

        Values may be JSON strings, numbers, or booleans; they are coerced to the
        canonical config string form.

        With `?slot=n` (0-based) the per-filament keys go to that slot's filament
        preset instead of the one open in the Filament tab: the tab is bound to the
        slot first, as its sidebar edit button does. Refused with `409
        filament_edits_unsaved` (nothing changed) when the tab holds unsaved edits
        to a different preset, `422 slot_out_of_range`, `400 invalid_slot`. The
        reply then also carries `slot` and `preset`.
      parameters:
        - name: slot
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: 0-based filament slot whose preset receives the per-filament keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: { layer_height: 0.28, wall_loops: 3 }
      responses:
        "200":
          description: All keys applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigApplyResult" }
              example: { applied: ["layer_height", "wall_loops"], errors: {} }
        "422":
          description: At least one key invalid — nothing applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigApplyResult" }
              example: { applied: [], errors: { layer_height: "value out of range", bogus_key: "unknown_key" } }
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_object: { value: { error: "body_must_be_object" } }
                bad_json:   { value: { error: "invalid_json" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`?slot=` given and the Filament tab holds unsaved edits to another preset; nothing changed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { applied: [], error: "filament_edits_unsaved", preset: "Generic PLA", modified: ["hot_plate_temp"] }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /filaments:
    get:
      summary: The project's filament slots
      operationId: getFilaments
      description: |
        One row per filament slot, as the sidebar shows them: the preset, its
        filament type, vendor and system flag, the project's colour for the slot,
        and whether the slot's preset is the one open in the Filament tab and
        holds unsaved edits (only that preset can). `tab` names the preset the
        tab edits and the slot it is bound to (null when it follows no slot).
        Builds with this route list `filament_slots` in `GET /status` capabilities.
      responses:
        "200":
          description: The slots.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  multi_filament: { type: boolean }
                  filaments:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer, description: 0-based slot }
                        preset: { type: string }
                        filament_type: { type: string, example: ASA }
                        vendor: { type: string, example: Generic }
                        colour: { type: string, example: "#FF0000" }
                        system: { type: boolean }
                        open_in_tab: { type: boolean }
                        modified: { type: boolean }
                        modified_keys:
                          type: array
                          items: { type: string }
                  tab:
                    type: object
                    properties:
                      preset: { type: string }
                      slot: { type: integer, nullable: true }
                      modified: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /slice:
    post:
      summary: Start slicing the current plate
      operationId: startSlice
      description: |
        Triggers a reslice of the current plate. Progress and completion are
        delivered as `slice.*` WebSocket events and via `GET /slice/status`.
      responses:
        "202":
          description: Slicing started.
          content:
            application/json:
              schema: { type: object, properties: { started: { type: boolean, enum: [true] } } }
              example: { started: true }
        "200":
          description: Plate already sliced (valid result) — nothing to do.
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean, enum: [false] }
                  already_valid: { type: boolean, enum: [true] }
              example: { started: false, already_valid: true }
        "409":
          description: A slice is already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "already_slicing" }
        "422":
          description: Nothing to slice (no objects on the plate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "nothing_to_slice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /slice/status:
    get:
      summary: Current/last slice state
      operationId: getSliceStatus
      responses:
        "200":
          description: Slice state snapshot. `stats` present once done; `warnings` always present (may be empty).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SliceStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /events:
    get:
      summary: WebSocket event stream (upgrade)
      operationId: events
      description: |
        **This is a WebSocket endpoint, not a normal GET.** Open a WebSocket to
        `ws://{host}:{port}/api/v1/events?token=<token>`. A bad/missing token
        closes the connection immediately. Inbound messages are ignored.

        Each message is a JSON object with an `event` field. See the
        `Event` schema for the payload shapes:
        `slice.started`, `slice.progress`, `slice.done`, `slice.error`,
        `slice.cancelled`, `slice.plate_changed`, `config.changed`, `project.opened`.

        Note: `slice.*` event payloads carry `stats` (on done) but NOT the slice
        `warnings` array — fetch `GET /slice/status` for warnings.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "101": { description: Switching Protocols (WebSocket handshake accepted). }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /plates:
    get:
      summary: List the plates
      operationId: getPlates
      description: |
        Every plate in the project with its index (0-based), name, whether it is the
        current one (the plate `slice`, `gcode`, `plate/render` and `jobs/status`
        act on), lock state, build volume and the objects it holds. Also reports
        `max` (the plate limit) and whether a plate can be added or deleted now.
      responses:
        "200":
          description: Plate list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
    post:
      summary: Add a plate
      operationId: createPlate
      description: |
        Same steps as the toolbar's "Add plate": a new empty plate is appended and,
        unless `select` is false, becomes the current plate.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                select: { type: boolean, default: true, description: "Make the new plate current." }
      responses:
        "200":
          description: Plate created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: boolean, enum: [true] }
                  index: { type: integer, description: "0-based index of the new plate." }
                  count: { type: integer }
                  current: { type: integer }
                  plate: { $ref: "#/components/schemas/Plate" }
        "409":
          description: A slice is running; plates cannot be added until it ends.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "slicing" }
        "422":
          description: The plate limit is reached (`max` says what it is).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "max_plates", max: 36 }
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /plates/{index}:
    delete:
      summary: Delete a plate
      operationId: deletePlate
      description: |
        Removes plate `index`. The objects it held are not deleted: they are parked
        beside the bed, as the toolbar's delete does, and `objects_moved_off_plate`
        reports how many. Later plates shift down one index.
      parameters:
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Plate deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, enum: [true] }
                  index: { type: integer }
                  count: { type: integer }
                  current: { type: integer }
                  objects_moved_off_plate: { type: integer }
        "404":
          description: No plate with that index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unknown_plate", count: 2 }
        "409":
          description: A slice is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "slicing" }
        "422":
          description: The only plate cannot be deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "last_plate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /plates/{index}/select:
    post:
      summary: Make a plate the current one
      operationId: selectPlate
      description: |
        Equivalent to clicking the plate: `slice`, `gcode`, `plate/render` and
        `jobs/status` then act on it. Selecting the current plate again is a no-op.
      parameters:
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Plate selected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  selected: { type: boolean, enum: [true] }
                  current: { type: integer }
                  plate: { $ref: "#/components/schemas/Plate" }
        "404":
          description: No plate with that index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unknown_plate", count: 2 }
        "409":
          description: A slice is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "slicing" }
        "422":
          description: The slicer refused the switch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "select_failed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /objects/{id}/plate:
    post:
      summary: Move an object onto a plate
      operationId: setObjectPlate
      description: |
        Moves one instance of the object (default instance 0) onto plate `plate`.
        From another plate it keeps its position relative to that plate; from
        off-plate it lands at the target plate's centre. The move takes an undo
        snapshot and refreshes the object list and background process like a drag.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Object id as reported by GET /objects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plate]
              properties:
                plate: { type: integer, minimum: 0, description: "0-based plate index from GET /plates." }
                instance: { type: integer, minimum: 0, default: 0 }
            example: { plate: 1 }
      responses:
        "200":
          description: Moved (or already there, with `moved` false and `already_on_plate` true).
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved: { type: boolean }
                  already_on_plate: { type: boolean }
                  id: { type: integer }
                  instance: { type: integer }
                  plate: { type: integer }
                  from_plate: { type: integer, description: "-1 when it was off every plate." }
                  offset: { $ref: "#/components/schemas/Vec3" }
              example: { moved: true, id: 832, instance: 0, plate: 1, from_plate: 0, offset: [409, 128, 6] }
        "400":
          description: Missing or malformed `plate` / `instance`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "missing_plate" }
        "404":
          description: Unknown object, instance or plate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                object:   { value: { error: "unknown_object" } }
                plate:    { value: { error: "unknown_plate", count: 2 } }
                instance: { value: { error: "unknown_instance", instances: 1 } }
        "409":
          description: A slice is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "slicing" }
        "422":
          description: The plate is locked, or the slicer refused the move.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                locked: { value: { error: "plate_locked" } }
                failed: { value: { error: "move_failed" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /project:
    get:
      summary: Project name, path and dirty state
      operationId: getProject
      responses:
        "200":
          description: The open project.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Project"
                  - type: object
                    properties:
                      modified:
                        type: array
                        description: Preset groups with unsaved edits.
                        items: { type: string }
                      recent_count: { type: integer, description: "Entries in File > Recent." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /project/save:
    post:
      summary: Save the project (File > Save / Save As)
      operationId: saveProject
      description: |
        Writes the project 3MF exactly as the menu does (plates, placement, per-object
        and per-plate settings, slot presets and colours, unsaved config edits) with
        no dialog. Without `path` the project is saved to its own path. With a `path`
        it is Save As, which refuses an existing file unless `overwrite` is true;
        saving onto the project's own path never counts as overwriting. The file
        goes to the top of File > Recent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string, nullable: true, description: "A .3mf path on the OrcaSlicer host." }
                overwrite: { type: boolean, default: false }
            example: { path: "/Users/me/float_spinner.3mf" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: string, description: "The project path as now stored." }
                  bytes: { type: integer }
                  project: { $ref: "#/components/schemas/Project" }
        "400":
          description: The path does not end in .3mf, or a field has the wrong type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "not_3mf" }
        "404":
          description: The target folder does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "directory_not_found", path: "/nowhere/a.3mf" }
        "409":
          description: A file is already there (pass overwrite), or a slice is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                exists:  { value: { error: "exists", path: "/Users/me/a.3mf" } }
                slicing: { value: { error: "slicing" } }
        "422":
          description: The project has never been saved and no path was given, the export failed, or overwrite was asked for without Preferences > Remote API > Allow deleting and replacing project files.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                nopath:  { value: { error: "no_project_path" } }
                failed:  { value: { error: "save_failed", path: "/Users/me/a.3mf" } }
                blocked: { value: { error: "blocked_by_remote_api_policy", path: "/Users/me/a.3mf" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /project/open:
    post:
      summary: Open a project (File > Open Project)
      operationId: openProject
      description: |
        Loads plates, objects, per-object and per-plate settings, slot presets and
        colours, and the project's config: not a geometry import. `path` names the
        file; `recent` names an entry of GET /project/recent instead. `if_unsaved`
        answers the "save changes to the current project?" prompt; `presets` says
        whether the project's presets are selected afterwards or the ones selected
        before the call. Unsaved preset edits are dropped before the open (the
        project's config replaces them) and named in `discarded_changes`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string, description: "A .3mf path on the OrcaSlicer host." }
                recent: { type: integer, minimum: 0, description: "An index from GET /project/recent, instead of path." }
                if_unsaved: { type: string, enum: [save, discard, fail], default: fail }
                presets: { type: string, enum: [project, keep_current], default: project }
            example: { path: "/Users/me/float_spinner.3mf", if_unsaved: "discard" }
      responses:
        "200":
          description: Opened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  opened: { type: string }
                  plates: { type: integer }
                  objects: { type: integer }
                  had_unsaved_changes: { type: boolean }
                  saved: { type: string, description: "Where the previous project was saved (if_unsaved: save)." }
                  discarded_changes: { type: array, items: { type: string } }
                  presets_restored: { type: array, items: { type: string }, description: "presets: keep_current only." }
                  presets:
                    type: object
                    properties:
                      printer: { type: string }
                      print: { type: string }
                      filaments: { type: array, items: { type: string } }
                  project: { $ref: "#/components/schemas/Project" }
        "400":
          description: Missing path or a bad value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                path:    { value: { error: "missing_path", detail: "pass path or recent" } }
                recent:  { value: { error: "bad_recent" } }
                unsaved: { value: { error: "bad_if_unsaved", detail: "save | discard | fail" } }
                presets: { value: { error: "bad_presets", detail: "project | keep_current" } }
        "404":
          description: No file at that path, or no such recent entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                file:   { value: { error: "file_not_found", path: "/Users/me/missing.3mf" } }
                recent: { value: { error: "unknown_recent", index: 7, count: 2 } }
        "409":
          description: A slice is running, or another project is still loading.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                slicing: { value: { error: "slicing" } }
                busy:    { value: { error: "busy" } }
        "422":
          description: Unsaved changes with if_unsaved fail, no path to save to, not a 3MF, the load failed, or the project brings its own script, G-code or connection settings while Preferences > Remote API > Allow script, G-code and connection edits is off (nothing is changed; `keys` lists them).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unsaved: { value: { error: "unsaved_changes", detail: "pass if_unsaved: \"save\" or \"discard\"", modified: ["print"] } }
                nopath:  { value: { error: "no_project_path" } }
                format:  { value: { error: "unsupported_format" } }
                failed:  { value: { error: "load_failed", path: "/Users/me/a.3mf" } }
                blocked: { value: { error: "blocked_by_remote_api_policy", path: "/Users/me/a.3mf", keys: ["machine_start_gcode", "post_process"] } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /project/new:
    post:
      summary: Start a new project (File > New Project)
      operationId: newProject
      description: |
        Same `if_unsaved` handling as open. The GUI's "keep the modified presets or
        discard them?" prompt is answered with Keep: unsaved preset edits carry over
        and are named in `kept_changes`. `name` gives the project its title.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                if_unsaved: { type: string, enum: [save, discard, fail], default: fail }
                name: { type: string, nullable: true, description: "The window title; Untitled when omitted." }
      responses:
        "200":
          description: A new, empty project is open.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  had_unsaved_changes: { type: boolean }
                  saved: { type: string }
                  kept_changes: { type: array, items: { type: string } }
                  project: { $ref: "#/components/schemas/Project" }
        "400":
          description: Bad if_unsaved or name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "bad_if_unsaved" }
        "409":
          description: A slice is running, or a project is still loading.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "slicing" }
        "422":
          description: Unsaved changes with if_unsaved fail, or no path to save to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unsaved_changes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /project/recent:
    get:
      summary: File > Recent
      operationId: getRecentProjects
      responses:
        "200":
          description: Most recent first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recent:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ProjectFile"
                        - type: object
                          properties:
                            index: { type: integer, description: "For POST /project/open {recent} and DELETE /project/recent {index}." }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
    delete:
      summary: Forget a recent entry, or the whole list
      operationId: forgetRecentProject
      description: Nothing on disk changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string, description: "The entry as listed, or any spelling of the same file while it exists." }
                index: { type: integer, minimum: 0 }
                all: { type: boolean, description: "Clear the list." }
            example: { path: "/Users/me/old.3mf" }
      responses:
        "200":
          description: The list as it is now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  forgotten: { type: array, items: { type: string } }
                  recent: { type: array, items: { $ref: "#/components/schemas/ProjectFile" } }
                  count: { type: integer }
        "400":
          description: No target, or a bad index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "missing_target", detail: "pass path, index or all:true" }
        "404":
          description: Not in the list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                path:  { value: { error: "not_in_recent", path: "/Users/me/x.3mf" } }
                index: { value: { error: "unknown_recent", index: 7, count: 2 } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /project/browse:
    get:
      summary: The .3mf files in a folder
      operationId: browseProjects
      description: |
        Not recursive, newest first, at most 500 (`truncated` says when there were
        more). Without `dir` the open project's folder is listed, else the folder
        the last file dialog used.
      parameters:
        - name: dir
          in: query
          required: false
          schema: { type: string }
          description: A folder on the OrcaSlicer host.
      responses:
        "200":
          description: The folder's project files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dir: { type: string }
                  files: { type: array, items: { $ref: "#/components/schemas/ProjectFile" } }
                  count: { type: integer }
                  truncated: { type: boolean }
        "400":
          description: No folder to list and none given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "missing_dir" }
        "404":
          description: No such folder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "directory_not_found", dir: "/nowhere" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /project/move:
    post:
      summary: Move or rename a project file
      operationId: moveProjectFile
      description: |
        Renames or moves a .3mf (copied and removed across volumes). For the open
        project's file the window follows (name, title, folder, File > Recent) and
        the next Save writes to the new path; otherwise a recent-list entry naming
        the old path is pointed at the new one. The open project's own file is
        never overwritten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string }
                to: { type: string }
                overwrite: { type: boolean, default: false }
            example: { from: "/Users/me/a.3mf", to: "/Users/me/projects/bracket.3mf" }
      responses:
        "200":
          description: Moved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved: { type: string }
                  to: { type: string }
                  bytes: { type: integer }
                  was_open: { type: boolean }
                  recent_updated: { type: boolean }
                  project: { $ref: "#/components/schemas/Project" }
        "400":
          description: Not .3mf paths, the same file, or a missing field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                format: { value: { error: "not_3mf" } }
                same:   { value: { error: "same_path" } }
        "404":
          description: The source is missing, or the destination folder does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "file_not_found", path: "/Users/me/a.3mf" }
        "409":
          description: A file is already there (pass overwrite), or it is the open project's file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                exists: { value: { error: "exists", path: "/Users/me/b.3mf" } }
                open:   { value: { error: "project_is_open", path: "/Users/me/b.3mf" } }
        "422":
          description: The OS refused the move, or overwrite was asked for without Preferences > Remote API > Allow deleting and replacing project files.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                failed:  { value: { error: "move_failed", detail: "Permission denied" } }
                blocked: { value: { error: "blocked_by_remote_api_policy", path: "/Users/me/b.3mf" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /project/file:
    delete:
      summary: Delete a project file from disk
      operationId: deleteProjectFile
      description: Permanent (no trash). Also removed from File > Recent. The open project's own file is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
            example: { path: "/Users/me/old.3mf" }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
                  bytes: { type: integer }
                  recent_updated: { type: boolean }
        "400":
          description: Not a .3mf path, or no path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "not_3mf" }
        "404":
          description: No file at that path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "file_not_found", path: "/Users/me/old.3mf" }
        "409":
          description: It is the open project's file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "project_is_open" }
        "422":
          description: The OS refused the delete, or Preferences > Remote API > Allow deleting and replacing project files is off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                failed:  { value: { error: "delete_failed", detail: "Permission denied" } }
                blocked: { value: { error: "blocked_by_remote_api_policy", path: "/Users/me/old.3mf" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-Api-Token
  responses:
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "unauthorized" }
    UiTimeout:
      description: The GUI thread did not respond within 10s.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "ui_timeout" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        detail: { type: string, description: "Present on 500 responses." }
      required: [error]
    Vec3:
      type: array
      items: { type: number }
      minItems: 3
      maxItems: 3
    Status:
      type: object
      properties:
        app: { type: string, example: OrcaSlicer }
        app_version: { type: string, example: "2.3.2" }
        api_version: { type: string, example: "1.0" }
        capabilities:
          type: array
          items: { type: string }
          example: [status, config, slice, events, plates, project]
        plates:
          type: object
          description: How many plates the project has and which one is current.
          properties:
            count: { type: integer }
            current: { type: integer }
        project: { type: string, description: "Current project path (empty until saved)." }
        project_name: { type: string, description: "The name in the window title (Untitled for a new project)." }
        project_dirty: { type: boolean, description: "True when File > Save has something to write." }
        objects:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              size_mm: { $ref: "#/components/schemas/Vec3" }
        presets:
          type: object
          properties:
            printer: { type: string }
            print: { type: string }
            filaments: { type: array, items: { type: string } }
        modified:
          type: object
          description: Dirty (unsaved) option keys per preset category.
          properties:
            print: { type: array, items: { type: string } }
            filament: { type: array, items: { type: string } }
            printer: { type: array, items: { type: string } }
        slice_result_valid: { type: boolean }
        slicing: { type: boolean, description: "True while a slice is in progress." }
    Plate:
      type: object
      properties:
        index: { type: integer, description: "0-based; shifts down when an earlier plate is deleted." }
        name: { type: string }
        current: { type: boolean, description: "The plate slice/gcode/render act on." }
        locked: { type: boolean }
        empty: { type: boolean }
        slice_result_valid: { type: boolean }
        origin: { $ref: "#/components/schemas/Vec3" }
        bbox_min: { $ref: "#/components/schemas/Vec3" }
        bbox_max: { $ref: "#/components/schemas/Vec3" }
        objects:
          type: array
          description: Instances the plate holds, from the plate's own bookkeeping.
          items:
            type: object
            properties:
              id: { type: integer }
              instance: { type: integer }
              name: { type: string }
    Project:
      type: object
      properties:
        name: { type: string }
        path: { type: string, description: "Empty until the project has been saved." }
        saved: { type: boolean }
        dirty: { type: boolean, description: "Plater edits, modified presets, or undo-stack changes since the last save." }
        plates: { type: integer }
        objects: { type: integer }
    ProjectFile:
      type: object
      description: A .3mf on the OrcaSlicer host, as GET /project/recent and GET /project/browse list it.
      properties:
        path: { type: string }
        name: { type: string, description: "The file name without .3mf." }
        exists: { type: boolean }
        open: { type: boolean, description: "The open project's own file." }
        size_bytes: { type: integer, description: "When the file exists." }
        modified: { type: string, format: date-time, description: "Last write time, UTC; when the file exists." }
    PlateList:
      type: object
      properties:
        plates:
          type: array
          items: { $ref: "#/components/schemas/Plate" }
        count: { type: integer }
        current: { type: integer }
        max: { type: integer, description: "Plate limit of this build." }
        can_add: { type: boolean }
        can_delete: { type: boolean }
    ConfigApplyResult:
      type: object
      properties:
        applied: { type: array, items: { type: string } }
        errors:
          type: object
          additionalProperties: { type: string }
          description: "key -> reason (e.g. unknown_key, or a validation message)."
      required: [applied, errors]
    SliceStats:
      type: object
      properties:
        estimated_time: { type: string, example: "27m 23s" }
        estimated_time_seconds: { type: number, example: 1643 }
        filament_used_mm: { type: number, example: 1582 }
        filament_used_g: { type: number, example: 4.72 }
        total_cost: { type: number, example: 0.094 }
    SliceWarning:
      type: object
      properties:
        level: { type: integer }
        message: { type: string }
        code: { type: string, example: "1000C001" }
    SliceStatus:
      type: object
      properties:
        state: { type: string, enum: [idle, slicing, done, error] }
        percent: { type: integer, description: "-1 when not slicing." }
        message: { type: string }
        stats: { $ref: "#/components/schemas/SliceStats" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/SliceWarning" }
      required: [state, percent, message, warnings]
    Event:
      type: object
      description: |
        A WebSocket message. `event` discriminates the shape.
      properties:
        event:
          type: string
          enum: [slice.started, slice.progress, slice.done, slice.error, slice.cancelled, slice.plate_changed, config.changed, project.opened]
        state: { type: string, description: "slice.* events: idle|slicing|done|error." }
        percent: { type: integer, description: "slice.* events." }
        message: { type: string, description: "slice.* events." }
        stats: { $ref: "#/components/schemas/SliceStats" }
        tabs:
          type: array
          description: "config.changed: which preset categories changed."
          items: { type: string, enum: [print, filament, printer, sla_print, sla_material, other] }
        project: { type: string, description: "project.opened: the opened project filename." }
      required: [event]
