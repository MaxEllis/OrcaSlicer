<!DOCTYPE html>
<!-- OrcaSlicer MCP panel. One page for every host: the messages it takes and sends are documented in
     docs/remote-api/README.md, "MCP panel page and protocol". Hosts vendor this file unchanged. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OrcaSlicer MCP</title>
<style>
  /* Colours: the host's theme variables where it sends them. The link, faint, warning, focus and type colours below
     are the starting points for each side (data-theme on the root): the view script measures the background the host
     really gives (and the row tints over it) and moves each colour's lightness until text reaches 4.5:1 and icons and
     the focus ring 3:1 there (McpPanelCore.themeColours), setting the result on the root. These values apply until
     then, or where the script cannot measure. */
  :root { --bg: var(--orca-bg, #2b2b2f); --fg: var(--orca-fg, #e8e8e8); --muted: var(--orca-muted, #a3a3a8);
          --border: var(--orca-border, #3c3c42); --accent: var(--orca-accent, #009688);
          --link: #5ad1c4; --faint: #9a9aa0; --warn: #f28b82; --focus: #5ad1c4;
          --hover: rgba(127,127,127,.12); --hover-soft: rgba(127,127,127,.08);
          --tip-bg: #121214; --tip-fg: #e8e8e8; --tip-border: #44444b;
          --t-set: #5fa8e8; --t-preset: #b28be8; --t-model: #e8a95a; --t-plate: #74c29a; --t-slice: #00a991;
          --font: var(--orca-font, "HarmonyOS Sans SC", "Segoe UI", system-ui, -apple-system, sans-serif); }
  :root[data-theme="light"] { --link: #00695c; --faint: #5f5f64; --warn: #b3261e; --focus: #00695c;
          --t-set: #1f6fb8; --t-preset: #7a4fc4; --t-model: #a8650f; --t-plate: #2e7d55; --t-slice: #00796b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--font); display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
  /* The host injects element defaults after this sheet (WebViewHostDialog: every button on the accent colour, with a
     border, padding and a hover filter). These win over that by specificity; any class rule below still wins. */
  html body button { background: none; border: 0; border-radius: 0; padding: 0; margin: 0; color: inherit; font: inherit; text-align: inherit; filter: none; }
  html body button:hover { filter: none; }
  /* Keyboard focus: a ring in the theme's focus colour on every control (rows are role=button). Rules that name
     :focus-visible stand alone: an engine without it drops only them (and keeps its default focus outline). */
  :focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 3px; }
  :focus:not(:focus-visible) { outline: none; }
  #app { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .title { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-bottom: 1px solid var(--border); flex: none; }
  .title .sp { flex: 1; }
  .list { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .ibtn { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 3px; color: var(--muted); cursor: pointer; }
  .ibtn:hover { background: var(--hover); color: var(--fg); }
  .ibtn:focus-visible { background: var(--hover); color: var(--fg); }
  .ibtn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .title [data-tip]:hover::after { top: calc(100% + 6px); bottom: auto; }

  svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .k-setting { color: var(--t-set); } .k-preset { color: var(--t-preset); } .k-model { color: var(--t-model); }
  .k-plate { color: var(--t-plate); } .k-slice { color: var(--t-slice); } .k-refused { color: var(--warn); } .k-file { color: var(--faint); } .k-note { color: var(--faint); }

  .empty { padding: 18px 14px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .empty button { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
  .offnote { border-bottom: 1px solid var(--border); }

  /* First run (a host that sends "setup"): how to connect an AI app, then that it connected. */
  .setup { padding: 14px 12px; }
  .setup .sh { font-weight: 600; font-size: 13.5px; margin-bottom: 3px; }
  .setup .slead { color: var(--muted); font-size: 12px; line-height: 1.45; margin-bottom: 10px; }
  .ssqs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .ssq { aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
         border: 1px solid var(--border); border-radius: 8px; background: var(--hover-soft); color: var(--muted); font-size: 11.5px; line-height: 1.2; text-align: center; padding: 4px; }
  .ssq svg { width: 26px; height: 26px; flex: none; }
  .ssq:hover { color: var(--fg); }
  .ssq[aria-pressed="true"] { border: 1.5px solid var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .sstep { margin: 12px 0 0; font-size: 12.5px; }
  .sroutes { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
  .sroute { border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; }
  .sroute b { font-weight: 600; display: block; } .sroute small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.4; margin: 1px 0 6px; }
  .sroute.off { border-style: dashed; } .sroute.off b { color: var(--muted); font-weight: 500; } .sroute.off small { margin-bottom: 0; }
  .sact { border-radius: 4px; padding: 3px 10px; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .sact.second { background: transparent; color: var(--fg); border-color: var(--border); }
  .sdone { color: var(--link); font-size: 12px; }
  /* A route whose app has a form of separate boxes: one line per box, each with its own Copy. */
  /* The values stay whole (a broken "orcaslicer-mcp" reads as two words); a long box name wraps instead. */
  .sfields { display: grid; grid-template-columns: minmax(0, 1fr) max-content auto; gap: 4px 8px; align-items: center; }
  .sfields > span { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
  .sfields code { white-space: nowrap; padding: 1px 5px; border: 1px solid var(--border); border-radius: 3px;
    font: 11.5px/1.35 Consolas, "Cascadia Mono", Menlo, monospace; }
  .sfields .sact, .sfields .sdone { justify-self: end; }
  .suv { margin-top: 7px; color: var(--muted); font-size: 11.5px; line-height: 1.4; }
  .sstat { display: flex; align-items: center; gap: 7px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .sstat.top { margin: 0 0 12px; padding: 0; border: 0; color: var(--fg); }
  .sdot { width: 8px; height: 8px; border-radius: 50%; background: #d9a441; flex: none; } .sdot.ok { background: #3fb27f; }
  /* Connected, nothing changed yet: the message in the middle of the empty panel, both ways. */
  .sconn { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px 20px; }
  .sconn .sstat.top { margin: 0 0 8px; }
  .sconn .slead { max-width: 240px; margin: 0; text-wrap: balance; }

  /* Links that act: underlined in the link colour. Unavailable ones: faint, no underline, no pointer. */
  .lnk { color: var(--link); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; border-radius: 2px; }
  .lnk.off { color: var(--faint); text-decoration: none; cursor: default; }
  .lnk.no { color: var(--muted); }
  .lnk:focus-visible { outline-offset: 1px; }

  .group { border-bottom: 1px solid var(--border); }
  .ghead { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; column-gap: 7px; min-height: 34px; padding: 0 10px; cursor: pointer; }
  .ghead:hover { background: var(--hover-soft); }
  .ghead .gt { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 7px; align-items: center; min-width: 0; min-height: 34px; text-align: left; }
  .ghead .t { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ghead .nm { min-width: 0; display: block; }
  .ghead .nm[data-tip]:hover::after { left: 0; transform: none; white-space: normal; max-width: 240px; }
  .ghead .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ghead .res { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
  .ghead .res.stale { color: var(--faint); }
  /* Restore: always shown (dimmed) on an older group, brighter on hover and focus. */
  /* opacity .8 keeps the dimmed icon at 3:1 or more (3.65:1 on #363636, 3.18:1 on #eeeeee with the hosts' muted). */
  .ghead .act { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 3px; color: var(--muted); opacity: .8; }
  .ghead:hover .act { opacity: 1; }
  .ghead .act:hover { background: var(--hover); color: var(--fg); }
  .ghead .act:focus-visible { opacity: 1; background: var(--hover); color: var(--fg); }
  .ghead .act.off { opacity: .3; cursor: default; }
  .ghead .act svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .group.open .ghead .t { color: var(--muted); }
  /* The restore question: a line under the group's title (the title stays). */
  .ask { display: none; grid-column: 1 / -1; flex-direction: column; align-items: flex-start; gap: 2px; font-size: 12px; padding: 0 0 8px 41px; cursor: default; }
  .ask .line { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .ask .note { color: var(--muted); font-size: 11.5px; }
  .ask .bad { color: var(--warn); font-size: 11.5px; overflow-wrap: anywhere; }
  .group.asking .ask, .group.busy .ask, .group.showerr .ask { display: flex; }
  .group.asking .ghead .act, .group.busy .ghead .act, .group.showerr .ghead .act { display: none; }
  .ask .wait { color: var(--muted); }

  .body { display: none; padding: 0 0 8px; }
  .group.open .body { display: block; }
  .row { display: grid; grid-template-columns: 14px minmax(4em, 1fr) fit-content(60%); gap: 8px; align-items: center; min-height: 26px; padding: 3px 10px 3px 51px; cursor: pointer; }
  .row:hover { background: var(--hover-soft); }
  .row .l { color: var(--muted); min-width: 0; display: block; }
  /* A long label wraps to a second line (and is cut after it), never truncated on one line. */
  .row .l .lt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
  .row .v { color: var(--fg); text-align: right; overflow-wrap: anywhere; min-width: 0; }
  .row .v .sw { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--border); border-radius: 2px; }
  .row .v .old { color: var(--faint); text-decoration: line-through; margin-right: 6px; }
  .row .old { text-decoration: line-through; }
  /* A long value goes on its own line under the label (the label keeps the row's width). */
  .row.long { grid-template-columns: 14px minmax(0, 1fr); }
  .row.long .v { grid-column: 2; text-align: left; }
  .row .l .chg { display: block; color: var(--muted); font-size: 11px; line-height: 1.2; }
  .row .l .chg .old { color: var(--muted); }
  .row.refused .v { color: var(--warn); }
  .row.stale .v, .row.stale .l .lt { color: var(--faint); }
  .row.dropped .v { color: var(--faint); }
  .more { display: none; padding: 0 10px 6px 73px; color: var(--muted); font-size: 12px; justify-content: space-between; gap: 8px; }
  .row.open, .row.open + .more { background: var(--hover-soft); }
  .row.open + .more { display: flex; }
  .more .d { min-width: 0; overflow-wrap: anywhere; }
  .more .d[data-tip]:hover::after { left: 0; transform: none; white-space: pre-line; max-width: 240px; }
  .more .d.bad { color: var(--warn); }
  .more .faint { color: var(--faint); white-space: nowrap; }
  .group.newest .ghead .name { font-weight: 600; color: var(--fg); }
  .group.older .ghead .name { color: var(--muted); }
  .group.undone .ghead .name, .group.undone .ghead .res { color: var(--faint); font-weight: 400; text-decoration: line-through; text-decoration-color: rgba(127,127,127,.4); }
  .group.undone .ghead { cursor: pointer; }
  .group.restored .ghead { cursor: default; grid-template-columns: 34px minmax(0, 1fr) auto; }
  .group.restored .ghead:hover { background: none; }
  .group.restored .faint { color: var(--faint); }
  .ghead .rl { display: flex; gap: 4px; align-items: baseline; min-width: 0; }
  .ghead .rl .name { min-width: 0; }
  .ghead .rl .sep { color: var(--muted); flex: none; }
  .group.restored [data-tip]:hover::after { top: calc(100% + 6px); bottom: auto; }
  [data-tip] { position: relative; }
  [data-tip]:hover::after {
    content: attr(data-tip); position: absolute; z-index: 5; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    white-space: nowrap; padding: 3px 7px; border-radius: 3px; background: var(--tip-bg); color: var(--tip-fg); border: 1px solid var(--tip-border); font-size: 11.5px; pointer-events: none; font-weight: 400; text-decoration: none; }
  /* A tag for the control the keyboard focused (P5): one element the view script places above the control, or below
     it, inside the pane and never over the control (McpPanelCore.placeTip). */
  .ftip { position: fixed; z-index: 6; left: 0; top: 0; max-width: 240px; padding: 3px 7px; border-radius: 3px; background: var(--tip-bg); color: var(--tip-fg);
          border: 1px solid var(--tip-border); font-size: 11.5px; line-height: 1.35; pointer-events: none; overflow-wrap: anywhere; white-space: pre-line; }
  .ftip[hidden] { display: none; }
  .tip-left:hover::after { left: auto; right: 0; transform: none; }
  .row .ic { display: inline-flex; }
  /* After the general tag rule: a row's tag and the restore icon's long tag wrap inside the pane. */
  .row .l[data-tip]:hover::after { left: 0; transform: none; white-space: normal; width: max-content; max-width: 200px; }
  .ghead .act[data-tip]:hover::after { white-space: normal; width: max-content; max-width: 220px; }
  /* A multi-line value's tag (value_tip: a few lines of a G-code template) keeps its line breaks, inside the pane. */
  .row .v[data-tip]:hover::after { left: auto; right: 0; transform: none; white-space: pre-line; width: max-content; max-width: 240px; text-align: left; }
</style>
</head>

    var st = setup.status;
    if (st && st.seen) {
      return '<div class="sconn"><div class="sstat top"><span class="sdot ok"></span><b>' + esc(st.app ? t('Connected to {app}', { app: st.app }) : t('Connected')) + '</b></div>' +
        '<div class="slead">' + esc(t('Ask it for the print you want. Its changes will appear here, each with Revert.')) + '</div></div>';
    }
    var app = setupCurrent();
    var squares = setup.apps.map(function (a) {
      return '<button type="button" class="ssq" data-sapp="' + esc(a.id) + '" data-fk="sa:' + esc(a.id) + '" aria-pressed="' + (a.id === app.id) + '">' +
        (a.icon || '') + '<span>' + esc(ht(a.name)) + '</span></button>';
    }).join('');
    var routes = app.routes.map(function (r, j) {
      var act = '';
      if (!r.off && r.act) act = setupDone['r' + j] ? '<span class="sdone">' + esc(r.open ? t('Opening\u2026') : t('Copied')) + '</span>'
        : '<button type="button" class="sact' + (r.primary ? '' : ' second') + '" data-' + (r.open ? 'sopen' : 'scopy') + '="r' + j + '" data-fk="sr' + j + '">' + esc(ht(r.act)) + '</button>';
      // An app whose form has separate boxes (ChatGPT: Command to launch, Arguments) gets one line per box, so nothing
      // pasted whole lands in the wrong one. The labels are that app's own words; the values are never translated.
      var fields = r.off || !r.fields || !r.fields.length ? '' : '<div class="sfields">' + r.fields.map(function (f, k) {
        var key = 'f' + j + '.' + k;
        return '<span>' + esc(ht(f.label)) + '</span><code>' + esc(f.value) + '</code>' + (setupDone[key]
          ? '<span class="sdone">' + esc(t('Copied')) + '</span>'
          : '<button type="button" class="sact second" data-scopy="' + key + '" data-fk="s' + key + '" aria-label="' + esc(t('Copy') + ' ' + ht(f.label)) + '">' + esc(t('Copy')) + '</button>');
      }).join('') + '</div>';
      return '<div class="sroute' + (r.off ? ' off' : '') + '"><b>' + esc(ht(r.label)) + '</b><small>' + esc(ht(r.hint)) + (r.also ? ' ' + esc(ht(r.also)) : '') + '</small>' + act + fields + '</div>';
    }).join('');
    // Every route runs the connector with uv: a host that names where to get it gets one line for that under the routes.
    var uv = !setup.uv ? '' : '<div class="suv">' + esc(t('Every app needs uv, a small free tool that runs the connector. Install it once.')) + ' ' +
      (setupDone.uv ? '<span class="sdone">' + esc(t('Opening\u2026')) + '</span>'
        : '<button type="button" class="lnk" data-suv="1" data-fk="suv">' + esc(t('Get uv')) + '</button>') + '</div>';
    var appName = ht(app.where || app.name);
    // "your app" (the host's word for any other app) gets whole sentences: a language with cases can't put one form of
    // it into both sentences ("where you use ..." and "waiting for ...").
    var anyApp = (app.where || app.name) === 'your app';
    return '<div class="setup"><div class="sh">' + esc(t('Connect your AI app')) + '</div>' +
      '<div class="slead">' + esc(t('Then tell it the print you want. Every change it makes shows up here, and you can undo any of it.')) + '</div>' +
      '<div class="ssqs">' + squares + '</div><div class="sstep"><span>' + esc(anyApp ? t('Set it up where you use your app') : t('Set it up where you use {app}', { app: appName })) + '</span><div class="sroutes">' + routes + '</div>' + uv + '</div>' +
      // No test question to ask: the first request from the app switches this to the connected view by itself.
      '<div class="sstat"><span class="sdot"></span>' + esc(anyApp ? t('Waiting for your app\u2026') : t('Waiting for {app}\u2026', { app: appName })) + '</div></div>';
  }
  function copyToClipboard(text, done) {
    function fallback() {
      var a = document.createElement('textarea'); a.value = text; document.body.appendChild(a); a.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} document.body.removeChild(a); done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    else fallback();
  }

  function applyHistory(m) {
    history = { rows: m.rows || [], groups: m.groups || [] };
    var c = m.capabilities || {};
    caps = { restore: !!c.restore, open_settings: c.open_settings !== false, settings_hint: c.settings_hint || '', off_text: c.off_text || '',
             settings_label: c.settings_label || '', reveal: c.reveal === true, tracked_live: c.tracked_live === true,
             language: typeof c.language === 'string' ? c.language : '' };
    Core.setLanguage(caps.language);
    restoredTo = has(m.restored_to) || m.restored_to === 0 ? m.restored_to : null;
    restoreFailed = restoredTo !== null && m.restore_failed === true;
    canUndoRestore = !!m.can_undo_restore;
    sliceValid = typeof m.slice_valid === 'boolean' ? m.slice_valid : null;
    gotHistory = true;
    if (readyTimer !== null) { window.clearTimeout(readyTimer); readyTimer = null; }
    var gs = Core.groupRows(history);
    var newest = gs.length ? gs[0].id : null;
    gs.forEach(function (g, i) { if (!(g.id in openGroups)) openGroups[g.id] = (i === 0); });
    if (newest !== null && newest !== newestSeen && newestSeen !== null) {
      openGroups[newest] = true;
      // The latest group is open and older ones closed: the group that was newest closes now, unless the user opened
      // it by hand (handOpened). Groups the user opened stay open.
      if (!handOpened[newestSeen] && gs.some(function (g) { return g.id === newestSeen; })) openGroups[newestSeen] = false;
    }
    newestSeen = newest;
    // rows that the host now reports as reverted no longer need the local mark
    history.rows.forEach(function (r) { if (has(r.undone_at)) { delete revertedHere[r.id]; delete pendingUndo[r.id]; } });
    if (asking !== null) {
      var ag = null;
      gs.forEach(function (g, i) { if (g.id === asking) ag = { g: g, newest: i === 0 }; });
      if (!ag || ag.newest || !caps.restore || !ag.g.restore || !ag.g.restore.available || isUndone(ag.g)) asking = null;
    }
    render();
    send({ action: 'live' });
  }

  function applyResult(m) {
    if (m.action === 'undo') {
      var id = m.row;
      delete pendingUndo[id];
      if (m.status === 'ok') { revertedHere[id] = true; delete undoError[id]; staleUpTo = Math.max(staleUpTo || 0, maxRowId()); }
      else if (m.status === 'failed') { undoError[id] = m.reason || N_('Could not revert'); openRows[id] = true; }
    } else {
      var key = m.action === 'undo_restore' ? 'undo' : m.group;
      if (restoreBusy === key) restoreBusy = null;
      if (m.status === 'failed') restoreError[key === undefined ? 'undo' : key] = m.reason || N_('Could not restore');
      // Where the keyboard goes: the restore's Undo line (it comes with the next history), or the error's OK.
      if (m.action === 'restore' && m.status === 'ok') { focusNext = 'ur'; focusTries = 0; }
      else if (m.action === 'restore' && m.status === 'failed' && key !== undefined) { focusNext = 'd:' + key; focusTries = 0; }
      if (m.status === 'ok') staleUpTo = Math.max(staleUpTo || 0, maxRowId());
      if (m.status === 'ok' && m.action === 'undo_restore') restoreUndoneAt = maxRowId();
    }
    render();
  }

  function liveSame(a, b) {
    var ka = Object.keys(a), kb = Object.keys(b);
    if (ka.length !== kb.length) return false;
    for (var i = 0; i < ka.length; i++) {
      var x = a[ka[i]], y = b[ka[i]];
      if (!y) return false;
      if (!!x.present !== !!y.present) return false;
      if (x.present && !Core.sameValue(x.value, y.value)) return false;
    }
    return true;
  }

  function receive(m) {
    if (!m || typeof m !== 'object') return;
    if (m.type === 'history') applyHistory(m);
    else if (m.type === 'live') {
      var nv = m.values || {};
      // slice_valid in a live message is optional: without it the last one stays.
      var sv = typeof m.slice_valid === 'boolean' ? m.slice_valid : sliceValid;
      if (!liveSame(live, nv) || sv !== sliceValid) { live = nv; sliceValid = sv; render(); }
    }
    else if (m.type === 'state') { api = m.api === 'off' ? 'off' : 'on'; render(); }
    else if (m.type === 'result') applyResult(m);
    else if (m.type === 'setup') { setup = m; render(); }
  }
  window.__mcpPanelReceive = receive;
  if (window.orca && window.orca.onMessage) window.orca.onMessage(receive);

  function ancestor(el, attr) {
    while (el && el !== document) { if (el.getAttribute && el.hasAttribute(attr)) return el; el = el.parentNode; }
    return null;
  }
  function toggleRow(rid) {
    openRows[rid] = !openRows[rid];
    // Opening a setting row also shows that setting in the host's settings sidebar (fire and forget).
    var rr = openRows[rid] ? rowById(rid) : null;
    if (rr && revealable(rr)) send({ action: 'reveal', row: rid });
    focusNext = 'r:' + rid;
    render();
  }
  // One click (or Enter / Space on a control): what it does.
  function activate(target) {
    var el;
    // An unavailable control (a disabled restore icon or undo link) does nothing, and never toggles its group.
    if (ancestor(target, 'aria-disabled')) return true;
    if ((el = ancestor(target, 'data-sapp'))) { setupApp = el.getAttribute('data-sapp'); setupDone = {}; focusNext = 'sa:' + setupApp; render(); return true; }
    if ((el = ancestor(target, 'data-sopen'))) {
      var ok = el.getAttribute('data-sopen'), or = setupCurrent().routes[Number(ok.slice(1))];
      if (or && or.open) { send({ action: 'open', url: or.open }); setupDone[ok] = true; render(); }
      return true;
    }
    if ((el = ancestor(target, 'data-suv'))) {
      if (setup && setup.uv) { send({ action: 'open', url: setup.uv }); setupDone.uv = true; render(); }
      return true;
    }
    if ((el = ancestor(target, 'data-scopy'))) {
      // "r<j>": route j's copy; "f<j>.<k>": box k of route j.
      var ck = el.getAttribute('data-scopy'), at = ck.slice(1).split('.'), cr = setupCurrent().routes[Number(at[0])] || {};
      var text = ck.charAt(0) === 'f' ? ((cr.fields || [])[Number(at[1])] || {}).value : cr.copy;
      if (text) copyToClipboard(text, function (done) { if (done) { setupDone[ck] = true; render(); } });
      return true;
    }
    if ((el = ancestor(target, 'data-undo'))) {
      var id = Number(el.getAttribute('data-undo'));
      pendingUndo[id] = 'busy'; delete undoError[id];
      focusNext = 'r:' + id;
      render(); send({ action: 'undo', row: id }); return true;
    }
    if (ancestor(target, 'data-undo-restore')) {
      restoreBusy = 'undo'; delete restoreError.undo;
      render(); send({ action: 'undo_restore' }); return true;
    }
    if ((el = ancestor(target, 'data-yes'))) {
      var gid = Number(el.getAttribute('data-yes'));
      asking = null; restoreBusy = gid; delete restoreError[gid];
      focusNext = 'g:' + gid;
      render(); send({ action: 'restore', group: gid }); return true;
    }
    if ((el = ancestor(target, 'data-no'))) { var nid = Number(el.getAttribute('data-no')); asking = null; focusNext = 'a:' + nid; render(); return true; }
    if ((el = ancestor(target, 'data-dismiss'))) { var did = Number(el.getAttribute('data-dismiss')); delete restoreError[did]; focusNext = 'g:' + did; render(); return true; }
    if ((el = ancestor(target, 'data-ask'))) { asking = Number(el.getAttribute('data-ask')); focusNext = 'n:' + asking; render(); return true; }
    if (ancestor(target, 'data-settings')) { send({ action: 'open_settings' }); return true; }
    if (ancestor(target, 'gear') || target.id === 'gear' || (target.closest && target.closest('#gear'))) {
      if (caps.open_settings) send({ action: 'open_settings' });
      return true;
    }
    if (target.closest && target.closest('#fold')) {
      var cand = shownGroups().filter(function (g) { return !isUndone(g); });
      var allOpen = cand.length > 0 && cand.every(function (g) { return openGroups[g.id]; });
      cand.forEach(function (g) {
        openGroups[g.id] = !allOpen;
        if (allOpen) delete handOpened[g.id]; else handOpened[g.id] = true;
      });
      render(); return true;
    }
    if (target.closest && target.closest('.more')) return false;
    if ((el = target.closest && target.closest('.row'))) { toggleRow(Number(el.getAttribute('data-row'))); return true; }
    if (target.closest && target.closest('.ask')) return false;
    if ((el = target.closest && target.closest('[data-toggle]'))) {
      var tid = Number(el.getAttribute('data-toggle'));
      if (asking === tid || restoreBusy === tid) return false;
      openGroups[tid] = !openGroups[tid];
      if (openGroups[tid]) handOpened[tid] = true; else delete handOpened[tid];
      focusNext = 'g:' + tid;
      render(); return true;
    }
    return false;
  }
  document.addEventListener('click', function (e) {
    if (ancestor(e.target, 'data-undo')) e.stopPropagation();
    activate(e.target);
  });
  // A click is not the keyboard: no focus tag, and an action's pending focus gives way to where the user went.
  document.addEventListener('mousedown', function () { kbFocus = false; focusNext = null; focusTries = 0; hideTip(); });
  document.addEventListener('focusin', function (e) { if (kbFocus) showTip(e.target); else hideTip(); });
  document.addEventListener('focusout', function () { hideTip(); });
  try {
    var listEl = document.getElementById('list');
    if (listEl && listEl.addEventListener) listEl.addEventListener('scroll', hideTip);
    // Back from a dialog the host showed (a restore pumps one): the focus an action asked for.
    if (window.addEventListener) window.addEventListener('focus', function () { if (focusNext && refocus(focusNext)) { focusNext = null; focusTries = 0; } });
  } catch (e) {}
  // Keyboard: Enter / Space on a row (role=button) opens it (buttons do that themselves); Esc answers No to the
  // restore question, else closes the open row the focus is in; Ctrl+P / Ctrl+S never print or save the page.
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k !== 'Shift' && k !== 'Control' && k !== 'Alt' && k !== 'Meta') kbFocus = true;
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (k === 'p' || k === 'P' || k === 's' || k === 'S')) {
      if (e.preventDefault) e.preventDefault();
      return;
    }
    var t = e.target || {};
    if (k === 'Escape' || k === 'Esc') {
      hideTip();
      if (asking !== null) {
        var gid = asking;
        asking = null; focusNext = 'a:' + gid; render();
        if (e.preventDefault) e.preventDefault();
        return;
      }
      var rowEl = t.closest ? t.closest('.row') : null;
      var rid = rowEl ? Number(rowEl.getAttribute('data-row')) : NaN;
      if (isNaN(rid) && t.closest && t.closest('.more')) {
        var u = t.getAttribute && (t.getAttribute('data-undo') || (t.getAttribute('data-fk') || '').replace(/^u:/, ''));
        rid = Number(u);
      }
      if (!isNaN(rid) && openRows[rid]) {
        openRows[rid] = false; focusNext = 'r:' + rid; render();
        if (e.preventDefault) e.preventDefault();
      }
      return;
    }
    if ((k === 'Enter' || k === ' ' || k === 'Spacebar') && t.getAttribute && t.getAttribute('role') === 'button' && t.hasAttribute && t.hasAttribute('data-row')) {
      if (e.preventDefault) e.preventDefault();
      toggleRow(Number(t.getAttribute('data-row')));
    }
  });
  // The host may miss the first ready (its message handler can register after the page's script ran): say it again
  // every READY_RETRY_MS until the first history arrives, at most READY_RETRIES more times.
  function retryReady() {
    readyTimer = null;
    if (gotHistory || readyTries >= READY_RETRIES) return;
    readyTries++;
    send({ action: 'ready' });
    readyTimer = window.setTimeout(retryReady, READY_RETRY_MS);
  }
  render();
  send({ action: 'ready' });
  send({ action: 'live' });
  if (!gotHistory) readyTimer = window.setTimeout(retryReady, READY_RETRY_MS);
})();
</script>
</body>
</html>
