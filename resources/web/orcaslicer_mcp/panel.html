<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OrcaSlicer MCP</title>
<style>
  :root { --bg: var(--orca-bg, #2b2b2f); --fg: var(--orca-fg, #e8e8e8); --muted: var(--orca-muted, #a3a3a8); --faint: #727278;
          --border: var(--orca-border, #3c3c42); --accent: var(--orca-accent, #009688); --warn: #e5675c;
          --hover: rgba(127,127,127,.12); --hover-soft: rgba(127,127,127,.08);
          --tip-bg: #121214; --tip-fg: #e8e8e8; --tip-border: #44444b;
          --t-set: #5fa8e8; --t-preset: #b28be8; --t-model: #e8a95a; --t-plate: #74c29a; --t-slice: #00a991;
          --font: var(--orca-font, "HarmonyOS Sans SC", "Segoe UI", system-ui, -apple-system, sans-serif); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--font); display: flex; flex-direction: column; overflow: hidden; }
  #app { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .title { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-bottom: 1px solid var(--border); flex: none; }
  .title .sp { flex: 1; }
  .list { flex: 1; overflow-y: auto; }
  .ibtn { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 3px; color: var(--muted); cursor: pointer; }
  .ibtn:hover { background: var(--hover); color: var(--fg); }
  .ibtn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .title [data-tip]:hover::after { top: calc(100% + 6px); bottom: auto; }

  svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .k-setting { color: var(--t-set); } .k-preset { color: var(--t-preset); } .k-model { color: var(--t-model); }
  .k-plate { color: var(--t-plate); } .k-slice { color: var(--t-slice); } .k-refused { color: var(--warn); } .k-start { color: var(--faint); } .k-file { color: var(--faint); }

  .empty { padding: 18px 14px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .empty a { color: var(--accent); cursor: pointer; }
  .offnote { border-bottom: 1px solid var(--border); }

  .group { border-bottom: 1px solid var(--border); }
  .ghead { position: relative; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 7px; min-height: 34px; padding: 0 10px; cursor: pointer; }
  .ghead:hover { background: var(--hover-soft); }
  .ghead .t { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ghead .nm { min-width: 0; display: block; }
  .ghead .nm[data-tip]:hover::after { left: 0; transform: none; white-space: normal; max-width: 240px; }
  .ghead .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ghead .res { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
  .ghead .act { position: absolute; right: 8px; top: 7px; width: 20px; height: 20px; display: none; place-items: center; border-radius: 3px; color: var(--muted); background: var(--bg); }
  .ghead:hover .act { display: grid; }
  .ghead:hover .act ~ .res, .ghead:hover .res.hide-on-hover { visibility: hidden; }
  .ghead .act:hover { background: var(--hover); color: var(--fg); }
  .ghead .act.off { opacity: .45; cursor: default; }
  .ghead .act svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .group.open .ghead .t { color: var(--muted); }
  .ask { display: none; grid-column: 2 / 4; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; padding: 6px 0; }
  .ask .line { display: flex; gap: 10px; justify-content: flex-end; }
  .ask .note { color: var(--muted); font-size: 11.5px; text-align: right; }
  .ask .bad { color: var(--warn); font-size: 11.5px; text-align: right; }
  .group.asking .ask, .group.busy .ask, .group.showerr .ask { display: flex; }
  .group.asking .ghead .nm, .group.asking .ghead .res, .group.asking .ghead .act,
  .group.busy .ghead .nm, .group.busy .ghead .res, .group.busy .ghead .act,
  .group.showerr .ghead .nm, .group.showerr .ghead .res, .group.showerr .ghead .act { display: none; }
  .ask a { color: var(--accent); cursor: pointer; } .ask a.no { color: var(--muted); }
  .ask .wait { color: var(--muted); }

  .body { display: none; padding: 0 0 8px; }
  .group.open .body { display: block; }
  .row { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; min-height: 26px; padding: 3px 10px 3px 51px; cursor: pointer; }
  .row:hover { background: var(--hover-soft); }
  .row .l { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .v { color: var(--fg); white-space: nowrap; }
  .row .l .chg { display: block; color: var(--faint); font-size: 11px; line-height: 1.2; }
  .row.refused .v { color: var(--warn); }
  .more { display: none; padding: 0 10px 6px 73px; color: var(--muted); font-size: 12px; justify-content: space-between; gap: 8px; }
  .row.open, .row.open + .more { background: var(--hover-soft); }
  .row.open + .more { display: flex; }
  .more .d { min-width: 0; }
  .more .d.bad { color: var(--warn); }
  .more a { color: var(--accent); cursor: pointer; white-space: nowrap; }
  .more a.off { color: var(--faint); cursor: default; }
  .more .faint { color: var(--faint); white-space: nowrap; }
  .group.undone .ghead .name, .group.undone .ghead .res { color: var(--faint); text-decoration: line-through; text-decoration-color: rgba(127,127,127,.4); }
  .group.undone .ghead { cursor: pointer; }
  .group.restored .ghead { cursor: default; }
  [data-tip] { position: relative; }
  [data-tip]:hover::after { content: attr(data-tip); position: absolute; z-index: 5; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    white-space: nowrap; padding: 3px 7px; border-radius: 3px; background: var(--tip-bg); color: var(--tip-fg); border: 1px solid var(--tip-border); font-size: 11.5px; pointer-events: none; font-weight: 400; text-decoration: none; }
  .tip-left:hover::after { left: auto; right: 0; transform: none; }
  .row .ic { display: inline-flex; }
</style>
</head>
<body>

  <symbol id="i-plate" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></symbol>

  <div class="title">Assistant<span class="sp"></span><span class="ibtn tip-left" id="fold"></span><span class="ibtn tip-left" id="gear"></span></div>

<script id="panel-core">
(function (root) {
  'use strict';

  var PROTOCOL_VERSION = 1;
  var START_TITLE = 'Before the assistant started';

  function has(s) { return s !== null && s !== undefined && s !== ''; }

  // history = {rows, groups}; returns groups newest first (start point, id 0, last),
  // each {id, ts, time, restore, rows}.
  function groupRows(history) {
    var rows = (history && history.rows) || [];
    var metas = (history && history.groups) || [];
    var byId = {};
    var list = [];
    function ensure(id, ts, time) {
      if (!byId[id]) {
        byId[id] = { id: id, ts: ts || 0, time: time || '', restore: null, rows: [] };
        list.push(byId[id]);
      }
      return byId[id];
    }
    metas.forEach(function (m) {
      var g = ensure(m.id, m.ts, m.time);
      g.ts = m.ts || 0;
      g.time = m.time || '';
      g.restore = m.restore || null;
    });
    rows.forEach(function (r) {
      var g = ensure(r.group, r.ts, r.time);
      g.rows.push(r);
    });
    list.sort(function (a, b) {
      if (a.id === 0 && b.id !== 0) return 1;
      if (b.id === 0 && a.id !== 0) return -1;
      if (a.ts !== b.ts) return b.ts - a.ts;
      return b.id - a.id;
    });
    return list;
  }

  function singleText(r) {
    var label = r.label || '';
    var value = has(r.value) ? String(r.value) : '';
    if (!value) return label;
    return label + (has(r.before) ? ' → ' : ' ') + value;
  }

  function groupTitle(group) {
    if (group.id === 0) return START_TITLE;
    var all = group.rows || [];
    if (!all.length) return '';
    var rows = all.filter(function (r) { return r.kind !== 'slice' && r.kind !== 'refused'; });
    if (!rows.length) {
      var refused = all.filter(function (r) { return r.kind === 'refused'; });
      if (refused.length) return (refused[0].label || '') + ' not allowed';
      return 'Sliced ' + (all[all.length - 1].where || '').trim();
    }
    var more = rows.length - 1;
    var win = null;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].title_hint === 'added' || rows[i].title_hint === 'opened') { win = rows[i]; break; }
    }
    if (win) {
      var t = (win.label || '') + (has(win.value) ? ' ' + win.value : '');
      return more > 0 ? t + ' and ' + more + ' more' : t;
    }
    if (more === 0) return singleText(rows[0]);
    return (rows[0].label || '') + ' and ' + more + ' more';
  }

  function formatDuration(sec) {
    sec = Math.max(0, Math.round(sec));
    if (sec < 60) return sec + 's';
    var mins = Math.round(sec / 60);
    if (mins < 60) return mins + 'm';
    var h = Math.floor(mins / 60);
    return h + 'h ' + (mins % 60) + 'm';
  }

  function groupResult(group) {
    var rows = group.rows || [];
    var text = '';
    var warn = false;
    rows.forEach(function (r) {
      if (r.kind === 'refused' || has(r.error)) warn = true;
      if (r.kind === 'slice' && r.result && typeof r.result.seconds === 'number') {
        text = formatDuration(r.result.seconds);
      }
    });
    return { text: text, warn: warn };
  }

  var NUM_RE = /^\s*([-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?)\s*(.*?)\s*$/;
  function parseNum(v) {
    var m = NUM_RE.exec(String(v));
    if (!m) return null;
    var n = Number(m[1]);
    return isFinite(n) ? { n: n, unit: m[2] } : null;
  }
  // Numbers match within 1e-6 relative (same unit text required); anything else exactly.
  function sameValue(a, b) {
    var x = parseNum(a), y = parseNum(b);
    if (x && y) {
      if (x.unit !== y.unit) return false;
      return Math.abs(x.n - y.n) <= 1e-6 * Math.max(Math.abs(x.n), Math.abs(y.n), 1e-12);
    }
    return String(a) === String(b);
  }

  function liveEntry(row, live) {
    return live && Object.prototype.hasOwnProperty.call(live, row.id) ? live[row.id] : null;
  }

  function liveDisplay(row, live, isNewest) {
    var shown = has(row.value) ? String(row.value) : '';
    var e = isNewest ? liveEntry(row, live) : null;
    if (!e) return { value: shown, note: '' };
    if (!e.present) return { value: shown, note: 'removed since' };
    if (!sameValue(e.value, shown)) return { value: String(e.value), note: 'changed by you' };
    return { value: shown, note: '' };
  }

  function undoState(row, live, isNewest) {
    if (!row.undo) return { available: false, why: '' };
    if (has(row.undone_at)) return { available: false, why: 'Reverted at ' + row.undone_at };
    var e = liveEntry(row, live);
    if (e) {
      if (!e.present) {
        var name = row.where || row.value || row.label || 'It';
        return { available: false, why: name + ' is no longer on the plate' };
      }
      if (!sameValue(e.value, has(row.value) ? String(row.value) : '')) {
        return {
          available: false,
          why: isNewest ? 'You changed it since' : 'Changed again since; restore an earlier point instead'
        };
      }
    }
    return { available: true, why: '' };
  }

  root.McpPanelCore = {
    PROTOCOL_VERSION: PROTOCOL_VERSION,
    groupRows: groupRows,
    groupTitle: groupTitle,
    groupResult: groupResult,
    liveDisplay: liveDisplay,
    undoState: undoState
  };
})(window);
</script>
<script id="panel-view">
(function () {
  'use strict';
  var Core = window.McpPanelCore;
  var TIP = { setting: 'Setting', preset: 'Preset', model: 'Model', plate: 'Plate', slice: 'Slice result', refused: 'Refused', file: 'File', start: 'Starting point' };
  var history = { rows: [], groups: [] };
  var caps = { restore: false, open_settings: true, settings_hint: '' };
  var restoredTo = null, canUndoRestore = false;
  var live = {};
  var api = 'on';
  var openGroups = {};          // group id -> bool
  var newestSeen = null;        // newest group id at the last render
  var openRows = {};            // row id -> bool
  var pendingUndo = {};         // row id -> 'busy'
  var undoError = {};           // row id -> reason
  var revertedHere = {};        // row id -> true (ok result, until history catches up)
  var asking = null;            // group id with confirm showing
  var restoreBusy = null;       // group id | 'undo'
  var restoreError = {};        // group id | 'undo' -> reason
  var groups = [];

  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function has(s) { return s !== null && s !== undefined && s !== ''; }
  function send(msg) { try { if (window.orca && window.orca.postMessage) window.orca.postMessage(msg); } catch (e) {} }
  function icon(k) { return '<svg class="i k-' + k + '"><use href="#i-' + k + '"/></svg>'; }

  function isNewest(g) { return groups.length && groups[0].id === g.id; }
  function isUndone(g) {
    if (restoredTo === null || restoredTo === undefined) return false;
    if (g.id === restoredTo) return false;
    var t = null;
    groups.forEach(function (x) { if (x.id === restoredTo) t = x; });
    if (restoredTo === 0) return g.id !== 0;
    if (!t) return false;
    return g.id !== 0 && (g.ts > t.ts || (g.ts === t.ts && g.id > t.id));
  }
  function groupsUndoneBy(g) {
    return groups.filter(function (x) {
      if (x.id === g.id) return false;
      if (g.id === 0) return x.id !== 0;
      return x.id !== 0 && (x.ts > g.ts || (x.ts === g.ts && x.id > g.id));
    });
  }
  function savedToDisk(r) { return r.on_disk === true; }
  function detailText(r, disp) {
    var parts = [];
    var b = has(r.before) ? String(r.before) : '';
    if (disp.note === 'changed by you' && b) {
      parts.push('Assistant set ' + r.value + ' \u00b7 was ' + b);
      return parts.join(' \u00b7 ');
    }
    if (b) parts.push('Was ' + b);
    if (has(r.where)) parts.push(r.where);
    return parts.join(' \u00b7 ');
  }
  function undoTip(r) {
    if (has(r.undo.tip)) return r.undo.tip;
    if (has(r.before)) return r.undo.verb + ': ' + r.label + ' back to ' + r.before;
    return r.undo.verb + ' ' + (has(r.value) ? r.value : r.label);
  }

  function rowHtml(r, g, newest) {
    var disp = Core.liveDisplay(r, live, newest);
    var detail = detailText(r, disp);
    var kind = r.kind === 'refused' || (r.kind === 'slice' && has(r.error)) ? 'refused' : r.kind;
    var rc = kind === 'refused' ? ' refused' : '';
    var open = openRows[r.id] ? ' open' : '';
    var tail = '';
    var errLine = undoError[r.id];
    if (r.undo) {
      var st = Core.undoState(r, live, newest);
      var reverted = has(r.undone_at) || revertedHere[r.id];
      if (reverted) {
        tail = '<span class="faint">Reverted</span>';
        if (has(r.undone_at)) tail = '<span class="faint tip-left" data-tip="Reverted at ' + esc(r.undone_at) + '">Reverted</span>';
      } else if (pendingUndo[r.id]) {
        tail = '<span class="faint">Reverting…</span>';
      } else if (st.available) {
        tail = '<a class="tip-left" data-undo="' + r.id + '" data-tip="' + esc(undoTip(r)) + '">' + esc(r.undo.verb) + '</a>';
      } else {
        tail = '<a class="off tip-left" data-tip="' + esc(st.why) + '">' + esc(r.undo.verb) + '</a>';
      }
    }
    var d = '<span class="d">' + esc(detail) + '</span>';
    var more = '<div class="more">' + d + tail + '</div>';
    if (errLine) more = '<div class="more"><span class="d bad">' + esc(errLine) + '</span>' + tail + '</div>';
    else if (kind === 'refused' && has(r.error) && !detail) more = '<div class="more"><span class="d">' + esc(r.error) + '</span>' + tail + '</div>';
    return '<div class="row' + rc + open + '" data-row="' + r.id + '"><span class="ic" data-tip="' + esc(TIP[kind] || '') + '">' + icon(kind) + '</span>' +
      '<span class="l">' + esc(r.label) + (disp.note ? '<span class="chg">' + esc(disp.note) + '</span>' : '') + '</span><span class="v">' + esc(disp.value) + '</span></div>' + more;
  }

  function groupHtml(g, idx) {
    var newest = idx === 0;
    var undone = isUndone(g);
    var open = !!openGroups[g.id] && !undone;
    var res = Core.groupResult(g);
    var cls = 'group' + (open ? ' open' : '') + (undone ? ' undone' : '');
    var restorable = caps.restore && !newest && !undone && g.restore;
    var ask = '';
    if (restoreBusy === g.id) {
      cls += ' busy';
      ask = '<span class="ask"><span class="line wait">Restoring…</span></span>';
    } else if (restoreError[g.id]) {
      cls += ' showerr';
      ask = '<span class="ask"><span class="line"><span class="bad">' + esc(restoreError[g.id]) + '</span><a class="no" data-dismiss="' + g.id + '">OK</a></span></span>';
    } else if (asking === g.id) {
      cls += ' asking';
      var notes = '';
      var undoneGroups = groupsUndoneBy(g);
      var disk = undoneGroups.some(function (x) { return x.rows.some(savedToDisk); });
      if (disk) notes += '<span class="note">Files and presets saved to disk stay.</span>';
      notes += '<span class="note">Your own changes since then are undone too.</span>';
      ask = '<span class="ask"><span class="line">Restore to ' + esc(g.time) + '? <a data-yes="' + g.id + '">Yes</a><a class="no" data-no="' + g.id + '">No</a></span>' + notes + '</span>';
    }
    var act = '';
    if (restorable && !ask) {
      var ok = g.restore.available;
      act = '<span class="act tip-left' + (ok ? '' : ' off') + '" ' + (ok ? 'data-ask="' + g.id + '"' : '') + ' data-tip="' + esc(ok ? 'Restore the project to ' + g.time : (g.restore.why || 'No restore point here')) + '"><svg><use href="#i-restore"/></svg></span>';
    }
    var resHtml = '<span class="res' + (act ? ' hide-on-hover' : '') + '">' + (res.warn ? icon('refused') : '') + esc(res.text) + '</span>';
    var title = Core.groupTitle(g);
    return '<div class="' + cls + '" data-g="' + g.id + '"><div class="ghead" data-toggle="' + g.id + '"><span class="t">' + esc(g.time) + '</span><span class="nm" data-tip="' + esc(title) + '"><span class="name">' + esc(title) + '</span></span>' +
      resHtml + act + ask + '</div><div class="body">' + g.rows.map(function (r) { return rowHtml(r, g, newest && !undone); }).join('') + '</div></div>';
  }

  function restoredLineHtml() {
    if (restoredTo === null || restoredTo === undefined) return '';
    var t = '';
    groups.forEach(function (g) { if (g.id === restoredTo) t = g.time; });
    var right;
    if (restoreBusy === 'undo') right = '<span class="ask" style="display:flex;grid-column:auto"><span class="line wait">Restoring…</span></span>';
    else if (restoreError.undo) right = '<span class="ask" style="display:flex;grid-column:auto"><span class="line"><span class="bad">' + esc(restoreError.undo) + '</span></span></span>';
    else if (canUndoRestore) right = '<span class="ask" style="display:flex;grid-column:auto"><a class="tip-left" data-undo-restore="1" data-tip="Go back to before the restore">Undo</a></span>';
    else right = '';
    return '<div class="group restored"><div class="ghead"><span class="t"></span><span class="name">Restored to ' + esc(t) + (canUndoRestore && !restoreBusy && !restoreError.undo ? ' \u00b7' : '') + '</span>' + right + '</div></div>';
  }

  function updateFold() {
    var cand = groups.filter(function (g) { return !isUndone(g); });
    var allOpen = cand.length > 0 && cand.every(function (g) { return openGroups[g.id]; });
    var f = document.getElementById('fold');
    f.setAttribute('data-tip', allOpen ? 'Collapse all' : 'Expand all');
    f.innerHTML = '<svg><use href="#i-' + (allOpen ? 'collapse' : 'expand') + '"/></svg>';
    f.style.visibility = groups.length ? 'visible' : 'hidden';
  }
  function updateGear() {
    var g = document.getElementById('gear');
    g.setAttribute('data-tip', caps.open_settings ? 'Remote API settings' : (caps.settings_hint || 'Settings'));
    g.innerHTML = '<svg><use href="#i-gear"/></svg>';
  }

  function render() {
    groups = Core.groupRows(history);
    var html = '';
    if (api === 'off') {
      html += '<div class="empty offnote">The Remote API is off.' + (caps.open_settings
        ? ' <a data-settings="1">Open the Remote API settings</a>'
        : (caps.settings_hint ? '<br>' + esc(caps.settings_hint) : '')) + '</div>';
    }
    if (!groups.length) {
      if (api !== 'off') html += '<div class="empty">When an assistant changes something, it shows up here.</div>';
    } else {
      html += restoredLineHtml();
      html += groups.map(groupHtml).join('');
    }
    var list = document.getElementById('list');
    var top = list.scrollTop;
    list.innerHTML = html;
    list.scrollTop = top;
    updateFold();
    updateGear();
  }

  function applyHistory(m) {
    history = { rows: m.rows || [], groups: m.groups || [] };
    var c = m.capabilities || {};
    caps = { restore: !!c.restore, open_settings: c.open_settings !== false, settings_hint: c.settings_hint || '' };
    restoredTo = has(m.restored_to) || m.restored_to === 0 ? m.restored_to : null;
    canUndoRestore = !!m.can_undo_restore;
    var gs = Core.groupRows(history);
    var newest = gs.length ? gs[0].id : null;
    gs.forEach(function (g, i) { if (!(g.id in openGroups)) openGroups[g.id] = (i === 0); });
    if (newest !== null && newest !== newestSeen && newestSeen !== null) openGroups[newest] = true;
    newestSeen = newest;
    // rows that the host now reports as reverted no longer need the local mark
    history.rows.forEach(function (r) { if (has(r.undone_at)) { delete revertedHere[r.id]; delete pendingUndo[r.id]; } });
    if (asking !== null) {
      var ag = null;
      gs.forEach(function (g, i) { if (g.id === asking) ag = { g: g, newest: i === 0 }; });
      if (!ag || ag.newest || !caps.restore || !ag.g.restore || !ag.g.restore.available || isUndone(ag.g)) asking = null;
    }
    render();
    send({ action: 'live' });
  }

  function applyResult(m) {
    if (m.action === 'undo') {
      var id = m.row;
      delete pendingUndo[id];
      if (m.status === 'ok') { revertedHere[id] = true; delete undoError[id]; }
      else if (m.status === 'failed') { undoError[id] = m.reason || 'Could not revert'; openRows[id] = true; }
    } else {
      var key = m.action === 'undo_restore' ? 'undo' : m.group;
      if (restoreBusy === key) restoreBusy = null;
      if (m.status === 'failed') restoreError[key === undefined ? 'undo' : key] = m.reason || 'Could not restore';
    }
    render();
  }

  function liveSame(a, b) {
    var ka = Object.keys(a), kb = Object.keys(b);
    if (ka.length !== kb.length) return false;
    for (var i = 0; i < ka.length; i++) {
      var x = a[ka[i]], y = b[ka[i]];
      if (!y) return false;
      if (!!x.present !== !!y.present) return false;
      if (x.present && !Core.sameValue(x.value, y.value)) return false;
    }
    return true;
  }

  function receive(m) {
    if (!m || typeof m !== 'object') return;
    if (m.type === 'history') applyHistory(m);
    else if (m.type === 'live') {
      var nv = m.values || {};
      if (!liveSame(live, nv)) { live = nv; render(); }
    }
    else if (m.type === 'state') { api = m.api === 'off' ? 'off' : 'on'; render(); }
    else if (m.type === 'result') applyResult(m);
  }
  window.__mcpPanelReceive = receive;
  if (window.orca && window.orca.onMessage) window.orca.onMessage(receive);

  function ancestor(el, attr) {
    while (el && el !== document) { if (el.getAttribute && el.hasAttribute(attr)) return el; el = el.parentNode; }
    return null;
  }
  document.addEventListener('click', function (e) {
    var el;
    if ((el = ancestor(e.target, 'data-undo'))) {
      e.stopPropagation();
      var id = Number(el.getAttribute('data-undo'));
      pendingUndo[id] = 'busy'; delete undoError[id];
      render(); send({ action: 'undo', row: id }); return;
    }
    if (ancestor(e.target, 'data-undo-restore')) {
      restoreBusy = 'undo'; delete restoreError.undo;
      render(); send({ action: 'undo_restore' }); return;
    }
    if ((el = ancestor(e.target, 'data-yes'))) {
      var gid = Number(el.getAttribute('data-yes'));
      asking = null; restoreBusy = gid; delete restoreError[gid];
      render(); send({ action: 'restore', group: gid }); return;
    }
    if (ancestor(e.target, 'data-no')) { asking = null; render(); return; }
    if ((el = ancestor(e.target, 'data-dismiss'))) { delete restoreError[Number(el.getAttribute('data-dismiss'))]; render(); return; }
    if ((el = ancestor(e.target, 'data-ask'))) { asking = Number(el.getAttribute('data-ask')); render(); return; }
    if (ancestor(e.target, 'data-settings')) { send({ action: 'open_settings' }); return; }
    if (ancestor(e.target, 'gear') || e.target.id === 'gear' || (e.target.closest && e.target.closest('#gear'))) {
      if (caps.open_settings) send({ action: 'open_settings' });
      return;
    }
    if (e.target.closest && e.target.closest('#fold')) {
      var cand = groups.filter(function (g) { return !isUndone(g); });
      var allOpen = cand.length > 0 && cand.every(function (g) { return openGroups[g.id]; });
      cand.forEach(function (g) { openGroups[g.id] = !allOpen; });
      render(); return;
    }
    if (e.target.closest && e.target.closest('.more')) return;
    if ((el = e.target.closest && e.target.closest('.row'))) {
      var rid = Number(el.getAttribute('data-row'));
      openRows[rid] = !openRows[rid]; render(); return;
    }
    if ((el = e.target.closest && e.target.closest('[data-toggle]'))) {
      var tid = Number(el.getAttribute('data-toggle'));
      if (asking === tid || restoreBusy === tid) return;
      openGroups[tid] = !openGroups[tid]; render(); return;
    }
  });
  render();
  send({ action: 'ready' });
  send({ action: 'live' });
})();
</script>
</body>
</html>
